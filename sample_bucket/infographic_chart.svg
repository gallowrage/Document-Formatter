<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" rx="16" fill="url(#bg)"/>
  
  <text x="40" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Dynamic Space-Budget & Layout Efficiency</text>
  <text x="40" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Comparison of dynamic layout solver vs static templates</text>
  
  <!-- Grid Lines -->
  <line x1="40" y1="260" x2="740" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="190" x2="740" y2="190" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="120" x2="740" y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Bars -->
  <!-- Set 1 -->
  <rect x="100" y="180" width="55" height="100" rx="6" fill="url(#bar1)"/>
  <rect x="170" y="110" width="55" height="170" rx="6" fill="url(#bar2)"/>
  <text x="162" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Layout Density</text>
  
  <!-- Set 2 -->
  <rect x="310" y="210" width="55" height="70" rx="6" fill="url(#bar1)"/>
  <rect x="380" y="90" width="55" height="190" rx="6" fill="url(#bar2)"/>
  <text x="372" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Visual Hierarchy</text>

  <!-- Set 3 -->
  <rect x="520" y="225" width="55" height="55" rx="6" fill="url(#bar1)"/>
  <rect x="590" y="70" width="55" height="210" rx="6" fill="url(#bar2)"/>
  <text x="582" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Pagination Precision</text>

  <!-- Legend -->
  <circle cx="580" cy="50" r="6" fill="#38bdf8"/>
  <text x="595" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Static Template</text>
  <circle cx="680" cy="50" r="6" fill="#a855f7"/>
  <text x="695" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dynamic Engine</text>
</svg>
